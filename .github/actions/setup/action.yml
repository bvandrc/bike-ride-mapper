name: Setup
description: Install pnpm, Node, and the project's dependencies.

runs:
  using: composite

  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        cache: pnpm

    # `setup-node`'s cache only covers pnpm's content-addressable store -- the
    # install still spends time linking that store into node_modules on every
    # job. Cache the installed tree itself so a hit skips the install outright.
    # Exact match only, no restore-keys: a partial hit would leave the tree
    # disagreeing with the lockfile.
    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
