name: Production Lighthouse

# Triggered by wait-for-deploy.yml once it detects a new build is actually
# live (since publishing does not occur in GitHub)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to audit
        required: false
        default: https://bvandrc.github.io/bike-ride-mapper/

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.target_url || 'https://bvandrc.github.io/bike-ride-mapper/' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Check target URL is reachable
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ env.PLAYWRIGHT_BASE_URL }}
          max-attempts: 5
          retry-delay: 5s
          retry-all: true

      - name: Run Lighthouse audits
        run: pnpm test:lighthouse:production

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: playwright/results
          if-no-files-found: ignore
