name: Production Lighthouse

# Triggers after Build & Deploy completes successfully on main, then polls
# for the GitHub Pages deploy to land before running Lighthouse audits.
# If no deploy is detected, the lighthouse job is skipped.

on:
  workflow_run:
    workflows: ["Build & Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to audit
        required: false
        default: https://bvandrc.github.io/bike-ride-mapper/

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wait-for-deploy:
    name: Wait for deploy
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.poll.outputs.deployed }}

    steps:
      - name: Poll for deploy
        id: poll
        uses: bvandrc/poll-for-deploy@v1
        with:
          url: https://bvandrc.github.io/bike-ride-mapper/

  lighthouse:
    name: Lighthouse
    needs: [wait-for-deploy]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.wait-for-deploy.outputs.deployed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.target_url || 'https://bvandrc.github.io/bike-ride-mapper/' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Check target URL is reachable
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ env.PLAYWRIGHT_BASE_URL }}
          max-attempts: 5
          retry-delay: 5s
          retry-all: true

      - name: Run Lighthouse audits
        run: pnpm test:lighthouse:production

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: playwright/results
          if-no-files-found: ignore
