name: Cleanup wait-for-deploy run

# A run can't delete itself while still in progress, so this runs
# separately, deleting every wait-for-deploy run unconditionally.

on:
  workflow_run:
    workflows: [Wait for deploy]
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the wait-for-deploy run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
