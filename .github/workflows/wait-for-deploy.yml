name: Wait for deploy

# Polls for a deploy after a push to master, and if one lands, dispatches
# Production Lighthouse.
# This run is deleted afterwards via cleanup-wait-for-deploy.yml

on:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: write

jobs:
  wait-for-deploy:
    name: Wait for deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      deployed: ${{ steps.poll.outputs.deployed }}

    steps:
      - name: Poll for deploy
        id: poll
        uses: bvandrc/poll-for-deploy@v1
        with:
          url: https://bvandrc.github.io/bike-ride-mapper/

      - name: Trigger Production Lighthouse
        if: steps.poll.outputs.deployed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-lighthouse.yml',
              ref: context.ref,
            });
