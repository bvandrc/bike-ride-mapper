name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check package.json key order
        uses: bvandrc/lint-package-json@v1

      - name: Lint & Type Check
        run: pnpm run check

  zap-security-scan:
    name: ZAP Security Scan
    runs-on: ubuntu-latest

    env:
      PORT: 4173

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build project
        run: pnpm build

      - name: Start server
        run: pnpm preview:ci &

      - name: Wait for server to be ready
        uses: jtalk/url-health-check-action@v5
        with:
          url: http://localhost:${{ env.PORT }}/bike-ride-mapper/
          max-attempts: 30
          retry-delay: 1s
          retry-all: true

      - name: ZAP Baseline Security Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:${{ env.PORT }}/bike-ride-mapper/
          cmd_options: '-a'
          fail_action: true
          allow_issue_writing: false
          rules_file_name: .zap/rules.tsv

      - name: Upload ZAP Security Scan report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-security-scan-report
          path: report_html.html
          if-no-files-found: ignore

  playwright:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            name: E2E Tests
          - suite: a11y
            name: Accessibility Tests
          - suite: lighthouse
            name: Lighthouse Audit

    env:
      PORT: 4173

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build project
        run: pnpm build

      - name: Start server
        run: pnpm preview:ci &

      - name: Wait for server to be ready
        uses: jtalk/url-health-check-action@v5
        with:
          url: http://localhost:${{ env.PORT }}/
          max-attempts: 30
          retry-delay: 1s
          retry-all: true

      - name: Run Playwright tests
        run: pnpm test:${{ matrix.suite }}

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-${{ matrix.suite }}
          path: playwright/results
          if-no-files-found: ignore
          retention-days: 7
