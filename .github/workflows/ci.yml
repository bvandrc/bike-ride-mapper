name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check package.json key order
        uses: bvandrc/lint-package-json@v1

      - name: Lint & Type Check
        run: pnpm run check

  test:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, a11y, lighthouse]

    env:
      PORT: 4173

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Build project
        env:
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: pnpm build

      - name: Start server
        run: pnpm preview:ci &

      - name: Wait for server to be ready
        uses: jtalk/url-health-check-action@v5
        with:
          url: http://localhost:${{ env.PORT }}/
          max-attempts: 30
          retry-delay: 1s
          retry-all: true

      - name: Run Playwright tests
        run: pnpm test:${{ matrix.suite }}

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-${{ matrix.suite }}
          path: playwright/results
          if-no-files-found: ignore
          retention-days: 7
